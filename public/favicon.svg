<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <!-- Cloche / Dining Cover Graphic -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Cloche Knob -->
    <circle cx="64" cy="38" r="7"/>
    <!-- Dome -->
    <path d="M28 72 C28 48, 44 44, 64 44 C84 44, 100 48, 100 72 Z"/>
    <!-- Tray / Plate -->
    <rect x="22" y="75" width="84" height="7" rx="3.5"/>
    <!-- Utensils Accent -->
    <path d="M48 88 L80 88" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>